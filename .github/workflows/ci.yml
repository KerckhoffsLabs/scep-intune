name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod  # keep the toolchain in sync with the module

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.14.0  # golangci-lint-action v9 requires golangci-lint v2.x

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # -race surfaces data races in the concurrent webhook handlers; -vet=all runs
      # the standard vet checks as part of the same pass.
      - name: Test
        run: go test -race -vet=all ./...
